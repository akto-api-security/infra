# Extract token from subdomain (uuid.webhook.test-util.akto.io -> uuid)
map $host $subdomain_token {
    default "";
    ~^([0-9a-fA-F-]+)\. $1;
}

server {
    listen 80;
    server_name localhost;

    # Health check: GET /healthz
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'OK';
    }

    # Create token: POST /token
    location = /token {
        proxy_pass http://webhook-site:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # List requests for token (for polling hit status): GET /token/{uuid}/requests
    location ~ "^/token/[0-9a-fA-F-]{36}/requests$" {
        proxy_pass http://webhook-site:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Capture URL (path-based): /{uuid} or /{uuid}/... (any method)
    location ~ "^/[0-9a-fA-F-]{36}(/.*)?$" {
        proxy_pass http://webhook-site:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else (UI, static, etc.) -> 404
    location / {
        return 404;
    }
}

# DNS-based capture: rewrite uuid.webhook.test-util.akto.io/... -> /uuid/...
server {
    listen 80;
    server_name ~^[0-9a-fA-F-]+\..*$;

    # Health check on DNS-based host
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'OK';
    }


    location / {
        rewrite ^ /$subdomain_token break;
        proxy_pass http://webhook-site:80;
        proxy_http_version 1.1;
        proxy_set_header Host webhook.test-util.akto.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}