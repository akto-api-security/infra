AWSTemplateFormatVersion: 2010-09-09
Description: >-
  This template does a simple setup for all Akto modules. It sets up all modules
  on a single instance. If you want a scalable and flexible setup, please
  contact support@akto.io.
Parameters:
  SubnetId:
    Type: 'AWS::EC2::Subnet::Id'
  KeyPair:
    Type: 'AWS::EC2::KeyPair::KeyName'
  DatabaseAbstractorUrl:
    Type: String
  DatabaseAbstractorToken:
    Type: String
  AllowedCidr:
    Type: String
    Description: CIDR block allowed to access the Akto services
    Default: '0.0.0.0/32'
  VpcId:
    Type: 'AWS::EC2::VPC::Id'
    Description: VPC ID where resources will be deployed
Mappings:
  RegionMap:
    af-south-1:
      AMI: ami-093ca241e4c72c205
    eu-north-1:
      AMI: ami-0f58e72599cb99a79
    ap-south-1:
      AMI: ami-0400aca7799d8cf19
    eu-west-3:
      AMI: ami-064c70d04ad799d5e
    eu-west-2:
      AMI: ami-0dfe6158087b5c0ac
    eu-south-1:
      AMI: ami-07b2af763a8b958f3
    eu-west-1:
      AMI: ami-047aad752a426ed48
    ap-northeast-3:
      AMI: ami-0cffa2172948e071e
    ap-northeast-2:
      AMI: ami-087af0192368bc87c
    me-south-1:
      AMI: ami-0a31e56929248acca
    ap-northeast-1:
      AMI: ami-0828596b82405edd7
    sa-east-1:
      AMI: ami-0df67b3c17f090c24
    ca-central-1:
      AMI: ami-0eb3718c42cb70e52
    ap-east-1:
      AMI: ami-0e992f1e63814db10
    ap-southeast-1:
      AMI: ami-0ba98499caf94125a
    ap-southeast-2:
      AMI: ami-0849cc8fe4ceaf988
    eu-central-1:
      AMI: ami-0f7585ae7a0d9a25a
    ap-southeast-3:
      AMI: ami-0cf40308729b83366
    us-east-1:
      AMI: ami-0d52ddcdf3a885741
    us-east-2:
      AMI: ami-04148302a14f7d12b
    us-west-1:
      AMI: ami-0ee3e1e65adeef858
    us-west-2:
      AMI: ami-0ec021424fb596d6c
Resources:
  AktoSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      VpcId: !Ref VpcId
      GroupDescription: 'Enable the ports Akto requires (22, 8000, 9092)'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          CidrIp: !Ref AllowedCidr
        - IpProtocol: tcp
          FromPort: 9092
          ToPort: 9092
          CidrIp: !Ref AllowedCidr
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  AktoLaunchTemplate:
    Type: 'AWS::EC2::LaunchTemplate'
    Properties:
      LaunchTemplateName: AktoLaunchTemplate
      LaunchTemplateData:
        ImageId: !FindInMap
          - RegionMap
          - !Ref 'AWS::Region'
          - AMI
        InstanceType: m6a.xlarge
        KeyName: !Ref KeyPair
        NetworkInterfaces:
          - AssociatePublicIpAddress: true
            SubnetId: !Ref SubnetId
            DeviceIndex: 0
            Groups:
              - !Ref AktoSecurityGroup
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeType: gp2
              DeleteOnTermination: true
              VolumeSize: 50
              Encrypted: true
        MetadataOptions:
          HttpTokens: required
        UserData: !Base64
          Fn::Join:
            - "\n"
            - - '#!/bin/bash -xe'
              - !Sub "export DATABASE_ABSTRACTOR_SERVICE_URL=${DatabaseAbstractorUrl}"
              - !Sub "export DATABASE_ABSTRACTOR_SERVICE_TOKEN=${DatabaseAbstractorToken}"
              - !Sub "export AKTO_KAFKA_IP=${AktoNLB.DNSName}"
              - touch /tmp/hello.txt
              - touch ~/hello.txt
              - sudo yum update -y
              - sudo yum install -y python python-setuptools
              - sudo yum install -y docker
              - sudo dockerd&
              - sudo systemctl enable /usr/lib/systemd/system/docker.service
              - sudo mkdir -p /opt/aws/bin
              - export COMPOSE_FILE=docker-compose-mini-runtime.yml
              - >-
                sudo wget
                https://s3.amazonaws.com/cloudformation-examples/aws-cfn-bootstrap-latest.tar.gz
              - >-
                sudo python -m easy_install --script-dir /opt/aws/bin
                aws-cfn-bootstrap-latest.tar.gz
              - >-
                curl -fsSL
                'https://raw.githubusercontent.com/akto-api-security/infra/feature/add-threat-client-cft/cf-deploy-akto'
                > cf-deploy-akto
              - sudo chmod 700 cf-deploy-akto
              - ./cf-deploy-akto < <(echo 'test')
              - sudo echo >> ~/akto/infra/docker-runtime.env
              - >-
                sudo echo AKTO_MONGO_CONN=$AKTO_MONGO_CONN >>
                ~/akto/infra/docker-runtime.env
              - >-
                sudo echo DATABASE_ABSTRACTOR_SERVICE_URL=$DATABASE_ABSTRACTOR_SERVICE_URL >>
                ~/akto/infra/docker-mini-runtime.env
              - >-
                sudo echo DATABASE_ABSTRACTOR_SERVICE_TOKEN=$DATABASE_ABSTRACTOR_SERVICE_TOKEN >>
                ~/akto/infra/docker-mini-runtime.env
              - sudo echo AKTO_KAFKA_IP=$AKTO_KAFKA_IP >> ~/akto/infra/.env
              - >-
                sudo echo AKTO_THREAT_PROTECTION_BACKEND_TOKEN=$DATABASE_ABSTRACTOR_SERVICE_TOKEN >>
                ~/akto/infra/docker-threat-detection.env
              - >-
                sudo echo DATABASE_ABSTRACTOR_SERVICE_TOKEN=$DATABASE_ABSTRACTOR_SERVICE_TOKEN >>
                ~/akto/infra/docker-threat-detection.env
              - >-
                curl -fsSL
                'https://raw.githubusercontent.com/akto-api-security/infra/feature/add-threat-client-cft/cf-deploy-akto-start'
                > cf-deploy-akto-start
              - sudo chmod 700 cf-deploy-akto-start
              - ./cf-deploy-akto-start < <(echo 'test')

  AktoAutoScalingGroup:
    Type: 'AWS::AutoScaling::AutoScalingGroup'
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref AktoLaunchTemplate
        Version: !GetAtt AktoLaunchTemplate.LatestVersionNumber
      VPCZoneIdentifier:
        - !Ref SubnetId
      TargetGroupARNs:
        - !Ref AktoTrafficMirroringTargetGroup
        - !Ref AktoKafkaTargetGroup
      MaxSize: '1'
      MinSize: '1'
  AktoTargetTrackingNetworkPolicy:
    Type: 'AWS::AutoScaling::ScalingPolicy'
    Properties:
      PolicyType: TargetTrackingScaling
      AutoScalingGroupName: !Ref AktoAutoScalingGroup
      EstimatedInstanceWarmup: 30
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageNetworkIn
        TargetValue: 200000000
  AktoNLB:
    Type: 'AWS::ElasticLoadBalancingV2::LoadBalancer'
    Properties:
      Type: network
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets:
        - !Ref SubnetId
      LoadBalancerAttributes:
        - Key: load_balancing.cross_zone.enabled
          Value: 'true'
  AktoTrafficMirroringTargetGroup:
    Type: 'AWS::ElasticLoadBalancingV2::TargetGroup'
    Properties:
      Port: '4789'
      Protocol: UDP
      HealthCheckEnabled: 'true'
      HealthCheckIntervalSeconds: 10
      HealthCheckPath: /metrics
      HealthCheckPort: '8000'
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 6
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      TargetType: instance
      VpcId: !Ref VpcId
      Targets: []
  AktoKafkaTargetGroup:
    Type: 'AWS::ElasticLoadBalancingV2::TargetGroup'
    Properties:
      Port: '9092'
      Protocol: TCP
      TargetType: instance
      HealthCheckEnabled: 'true'
      HealthCheckIntervalSeconds: 10
      HealthCheckPath: /metrics
      HealthCheckPort: '8000'
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 6
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      VpcId: !Ref VpcId
      Targets: []
  AktoKafkaListener:
    Type: 'AWS::ElasticLoadBalancingV2::Listener'
    Properties:
      LoadBalancerArn: !Ref AktoNLB
      Port: '9092'
      Protocol: TCP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AktoKafkaTargetGroup
Outputs:
  AktoNLB:
    Description: The IP address of the AktoNLB
    Value: !GetAtt
      - AktoNLB
      - DNSName
    Export:
      Name: AktoNLBIP