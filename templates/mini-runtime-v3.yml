AWSTemplateFormatVersion: 2010-09-09
Description: >-
  This template does a simple setup for all Akto modules. It sets up all modules
  on a single instance. If you want a scalable and flexible setup, please
  contact support@akto.io.
Parameters:
  SubnetId:
    Type: 'List<AWS::EC2::Subnet::Id>'
    Description: >-
      Private subnets for Akto, at most one per Availability Zone, all in the
      same VPC. Each subnet needs outbound internet access (typically via NAT).
  KeyPair:
    Type: 'AWS::EC2::KeyPair::KeyName'
  DatabaseAbstractorUrl:
    Type: String
  DatabaseAbstractorToken:
    Type: String
    NoEcho: true
  PrivateLinkAllowedAccountIds:
    Type: CommaDelimitedList
    Default: ''
    Description: >-
      Optional. AWS account IDs allowed to reach the Akto NLB (data ingestion
      9091) over PrivateLink, comma separated with no spaces (e.g.
      111111111111,222222222222). Leave empty to disable PrivateLink.
Conditions:
  EnablePrivateLink: !Not [!Equals [!Join ['', !Ref PrivateLinkAllowedAccountIds], '']]
Mappings:
  RegionMap:
    af-south-1:
      AMI: ami-0f084342d7f5e20c8
    eu-north-1:
      AMI: ami-04c267a6ca05944f8
    ap-south-1:
      AMI: ami-0cd4165aeb4c1a32d
    eu-west-3:
      AMI: ami-0c809358d149b3ca3
    eu-west-2:
      AMI: ami-0971ecff4a7a231a6
    eu-south-1:
      AMI: ami-0d8672ab992932f99
    eu-west-1:
      AMI: ami-0f7a6ae0b7f75d496
    ap-northeast-3:
      AMI: ami-00e32c9c57db03de7
    ap-northeast-2:
      AMI: ami-06349ab19e153f406
    me-south-1:
      AMI: ami-0a31e56929248acca
    ap-northeast-1:
      AMI: ami-033fab41988ee3766
    sa-east-1:
      AMI: ami-037c1f1096995bb4c
    ca-central-1:
      AMI: ami-0a23f7c709e7ba0d1
    ap-east-1:
      AMI: ami-0214dccfc2bd19534
    ap-southeast-1:
      AMI: ami-08c9f7e48c17bba07
    ap-southeast-2:
      AMI: ami-0cdf69fbf2afc0c3c
    eu-central-1:
      AMI: ami-085c681bbe9389324
    ap-southeast-3:
      AMI: ami-01a74999f054ec9c2
    us-east-1:
      AMI: ami-097855b862d5b1eb2
    us-east-2:
      AMI: ami-02116a92b402a4f8d
    us-west-1:
      AMI: ami-0cd26b05d55882da3
    us-west-2:
      AMI: ami-071672625ad35d880
Resources:
  DatabaseAbstractorTokenSecret:
    Type: 'AWS::SecretsManager::Secret'
    Properties:
      Description: Akto Database Abstractor service token
      SecretString: !Ref DatabaseAbstractorToken
  GetAktoSetupDetailsLambdaBasicExecutionRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      Path: /
      Policies:
        - PolicyName: GetAktoSetupDetailsExecuteLambda
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                # These Describe actions do not support resource-level permissions
                Action:
                  - 'ec2:DescribeNetworkInterfaces'
                  - 'ec2:DescribeTrafficMirrorSessions'
                  - 'ec2:DescribeInstances'
                  - 'ec2:DescribeVpcs'
                  - 'elasticloadbalancing:DescribeLoadBalancers'
                  - 'elasticloadbalancing:DescribeTargetGroups'
                  - 'elasticloadbalancing:DescribeTargetHealth'
                Resource: '*'
  GetAktoSetupDetails:
    Type: 'AWS::Lambda::Function'
    Properties:
      Runtime: nodejs24.x
      Timeout: 60
      Role: !GetAtt
        - GetAktoSetupDetailsLambdaBasicExecutionRole
        - Arn
      Handler: index.handler
      Environment:
        Variables:
          TARGET_LB: !Ref AktoNLB
      Code:
        S3Bucket: !Sub 'akto-setup-${AWS::Region}'
        S3Key: templates/get-akto-setup-details-v3.zip
  GetVpcDetailsLambdaRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Path: /
      Policies:
        - PolicyName: DescribeAssetsPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                # These Describe actions do not support resource-level permissions
                Action:
                  - 'ec2:DescribeVpcs'
                  - 'ec2:DescribeSubnets'
                Resource: '*'
  GetVpcDetailsLambda:
    Type: 'AWS::Lambda::Function'
    Properties:
      Description: Look up the VPC and open Akto ports on the Akto security group
      Handler: index.handler
      Runtime: nodejs24.x
      Timeout: 30
      Role: !GetAtt
        - GetVpcDetailsLambdaRole
        - Arn
      Environment:
        Variables:
          SUBNET_ID: !Select [0, !Ref SubnetId]
      Code:
        ZipFile: |
          const {
            EC2Client, DescribeSubnetsCommand, DescribeVpcsCommand, AuthorizeSecurityGroupIngressCommand,
          } = require('@aws-sdk/client-ec2');
          const ec2 = new EC2Client({});

          async function sendResponse(event, context, status, data, reason) {
            const body = JSON.stringify({
              Status: status,
              Reason: reason || `See CloudWatch log stream: ${context.logStreamName}`,
              PhysicalResourceId: event.PhysicalResourceId || context.logStreamName,
              StackId: event.StackId,
              RequestId: event.RequestId,
              LogicalResourceId: event.LogicalResourceId,
              Data: data || {},
            });
            await fetch(event.ResponseURL, { method: 'PUT', headers: { 'Content-Type': '' }, body });
          }

          // Used by two custom resources:
          //  - CustomSourceGetVpcDetails: returns the VpcId of SUBNET_ID
          //  - CustomSourceConfigureSecurityGroups: opens each "protocol:port" in Ports on
          //    SecurityGroupId from every CIDR associated with the VPC
          exports.handler = async (event, context) => {
            try {
              if (event.RequestType === 'Delete') {
                await sendResponse(event, context, 'SUCCESS');
                return;
              }
              const subnetId = process.env.SUBNET_ID;
              console.log('Looking up VPC for subnet', subnetId);
              const resp = await ec2.send(new DescribeSubnetsCommand({ SubnetIds: [subnetId] }));
              const subnet = resp.Subnets && resp.Subnets[0];
              if (!subnet) {
                throw new Error('Could not find subnet ' + subnetId);
              }
              console.log('Found VpcId', subnet.VpcId);
              const props = event.ResourceProperties || {};
              if (props.SecurityGroupId) {
                const vpcResp = await ec2.send(new DescribeVpcsCommand({ VpcIds: [subnet.VpcId] }));
                const cidrs = vpcResp.Vpcs[0].CidrBlockAssociationSet
                  .filter((a) => a.CidrBlockState.State === 'associated')
                  .map((a) => a.CidrBlock);
                console.log('VPC CIDRs', cidrs);
                for (const spec of props.Ports || []) {
                  const [protocol, port] = spec.split(':');
                  for (const cidr of cidrs) {
                    try {
                      await ec2.send(new AuthorizeSecurityGroupIngressCommand({
                        GroupId: props.SecurityGroupId,
                        IpPermissions: [{
                          IpProtocol: protocol, FromPort: Number(port), ToPort: Number(port),
                          IpRanges: [{ CidrIp: cidr }],
                        }],
                      }));
                      console.log('Opened', spec, 'from', cidr);
                    } catch (err) {
                      if (err.name !== 'InvalidPermission.Duplicate' && err.Code !== 'InvalidPermission.Duplicate') throw err;
                      console.log('Already open', spec, 'from', cidr);
                    }
                  }
                }
              }
              await sendResponse(event, context, 'SUCCESS', { VpcId: subnet.VpcId });
            } catch (err) {
              console.error(err);
              await sendResponse(event, context, 'FAILED', {}, String(err));
            }
          };
  # Separate from the role to avoid a circular dependency (role -> Lambda name -> role)
  GetVpcDetailsLambdaLogsPolicy:
    Type: 'AWS::IAM::Policy'
    Properties:
      PolicyName: GetVpcDetailsLambdaLogs
      Roles:
        - !Ref GetVpcDetailsLambdaRole
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - 'logs:CreateLogGroup'
              - 'logs:CreateLogStream'
              - 'logs:PutLogEvents'
            Resource: !Sub >-
              arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${GetVpcDetailsLambda}:*
  CustomSourceGetVpcDetails:
    Type: 'AWS::CloudFormation::CustomResource'
    DependsOn: GetVpcDetailsLambdaLogsPolicy
    Properties:
      ServiceToken: !GetAtt
        - GetVpcDetailsLambda
        - Arn
  IamInstanceProfile:
    Type: 'AWS::IAM::InstanceProfile'
    Properties:
      Path: /
      Roles:
        - !Ref RefreshHandlerLambdaBasicExecutionRole
  RefreshHandlerLambdaBasicExecutionRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
      Policies:
        - PolicyName: InvokeLambdaPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Resource:
                  - !GetAtt
                    - DashboardInstanceRefreshHandler
                    - Arn
                  - !GetAtt
                    - TrafficMirroringInstanceRefreshHandler
                    - Arn
                Action: 'lambda:InvokeFunction'
        - PolicyName: ReadDatabaseAbstractorTokenSecret
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: 'secretsmanager:GetSecretValue'
                Resource: !Ref DatabaseAbstractorTokenSecret
  AktoSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      VpcId: !GetAtt
        - CustomSourceGetVpcDetails
        - VpcId
      GroupDescription: 'Enable the ports Akto requires (22, 4789, 8000, 9092)'
      SecurityGroupIngress: []
      SecurityGroupEgress: []

  AktoLaunchTemplate:
    Type: 'AWS::EC2::LaunchTemplate'
    Properties:
      LaunchTemplateName: AktoLaunchTemplate
      LaunchTemplateData:
        ImageId: !FindInMap
          - RegionMap
          - !Ref 'AWS::Region'
          - AMI
        InstanceType: m5a.xlarge
        KeyName: !Ref KeyPair
        NetworkInterfaces:
          - AssociatePublicIpAddress: false
            DeviceIndex: 0
            Groups:
              - !Ref AktoSecurityGroup
        IamInstanceProfile:
          Arn: !GetAtt IamInstanceProfile.Arn
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeType: gp3
              DeleteOnTermination: true
              VolumeSize: 50
              Encrypted: true
        MetadataOptions:
          HttpTokens: required
        UserData: !Base64
          Fn::Join:
            - "\n"
            - - '#!/bin/bash -xe'
              - !Sub "export DATABASE_ABSTRACTOR_SERVICE_URL=${DatabaseAbstractorUrl}"
              - !Sub >-
                DATABASE_ABSTRACTOR_SERVICE_TOKEN=$(aws secretsmanager get-secret-value
                --secret-id ${DatabaseAbstractorTokenSecret} --region ${AWS::Region}
                --query SecretString --output text)
              - '[ -n "$DATABASE_ABSTRACTOR_SERVICE_TOKEN" ] || { echo "Failed to read DatabaseAbstractorToken from Secrets Manager"; exit 1; }'
              - export DATABASE_ABSTRACTOR_SERVICE_TOKEN
              - !Sub "export AKTO_KAFKA_IP=${AktoNLB.DNSName}"
              - touch /tmp/hello.txt
              - touch ~/hello.txt
              - sudo yum update -y
              - sudo yum install -y docker unzip
              - sudo dockerd&
              - sudo systemctl enable /usr/lib/systemd/system/docker.service
              - sudo yum install -y aws-cfn-bootstrap || true
              - export COMPOSE_FILE=docker-compose-mini-runtime.yml
              - >-
                curl -fsSL
                'https://raw.githubusercontent.com/akto-api-security/infra/feature/mini-runtime-cft/cf-deploy-akto'
                > cf-deploy-akto
              - sudo chmod 700 cf-deploy-akto
              - ./cf-deploy-akto < <(echo 'test')
              - sudo echo " " >> ~/akto/infra/docker-runtime.env
              - >-
                sudo echo AKTO_MONGO_CONN=$AKTO_MONGO_CONN >>
                ~/akto/infra/docker-runtime.env
              - sudo echo " " >> ~/akto/infra/docker-mini-runtime.env
              - >-
                sudo echo DATABASE_ABSTRACTOR_SERVICE_URL=$DATABASE_ABSTRACTOR_SERVICE_URL >>
                ~/akto/infra/docker-mini-runtime.env
              - >-
                sudo echo DATABASE_ABSTRACTOR_SERVICE_TOKEN=$DATABASE_ABSTRACTOR_SERVICE_TOKEN >>
                ~/akto/infra/docker-mini-runtime.env
              - sudo echo AKTO_KAFKA_IP=$AKTO_KAFKA_IP >> ~/akto/infra/.env
              - >-
                sudo sed -i "s/AKTO_THREAT_PROTECTION_BACKEND_TOKEN=.*/AKTO_THREAT_PROTECTION_BACKEND_TOKEN=$DATABASE_ABSTRACTOR_SERVICE_TOKEN/"
                ~/akto/infra/docker-threat-detection.env
              - >-
                sudo sed -i "s/DATABASE_ABSTRACTOR_SERVICE_TOKEN=.*/DATABASE_ABSTRACTOR_SERVICE_TOKEN=$DATABASE_ABSTRACTOR_SERVICE_TOKEN/"
                ~/akto/infra/docker-threat-detection.env
              - >-
                curl -fsSL
                'https://raw.githubusercontent.com/akto-api-security/infra/feature/mini-runtime-cft/cf-deploy-akto-start'
                > cf-deploy-akto-start
              - sudo chmod 700 cf-deploy-akto-start
              - ./cf-deploy-akto-start < <(echo 'test')

  AktoAutoScalingGroup:
    Type: 'AWS::AutoScaling::AutoScalingGroup'
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref AktoLaunchTemplate
        Version: !GetAtt AktoLaunchTemplate.LatestVersionNumber
      VPCZoneIdentifier: !Ref SubnetId
      TargetGroupARNs:
        - !Ref AktoTrafficMirroringTargetGroup
        - !Ref AktoKafkaTargetGroup
        - !Ref AktoDataIngestionTargetGroup
      MaxSize: '10'
      MinSize: '1'
  AktoTargetTrackingNetworkPolicy:
    Type: 'AWS::AutoScaling::ScalingPolicy'
    Properties:
      PolicyType: TargetTrackingScaling
      AutoScalingGroupName: !Ref AktoAutoScalingGroup
      EstimatedInstanceWarmup: 200
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageNetworkIn
        TargetValue: 200000000
  AktoNLB:
    Type: 'AWS::ElasticLoadBalancingV2::LoadBalancer'
    Properties:
      Type: network
      Scheme: internal
      IpAddressType: ipv4
      Subnets: !Ref SubnetId
      LoadBalancerAttributes:
        - Key: load_balancing.cross_zone.enabled
          Value: 'true'
  AktoTrafficMirroringTargetGroup:
    Type: 'AWS::ElasticLoadBalancingV2::TargetGroup'
    Properties:
      Port: '4789'
      Protocol: UDP
      HealthCheckEnabled: 'true'
      HealthCheckIntervalSeconds: 10
      HealthCheckPath: /metrics
      HealthCheckPort: '8000'
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 6
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      TargetType: instance
      VpcId: !GetAtt
        - CustomSourceGetVpcDetails
        - VpcId
      Targets: []
  AktoKafkaTargetGroup:
    Type: 'AWS::ElasticLoadBalancingV2::TargetGroup'
    Properties:
      Port: '9092'
      Protocol: TCP
      TargetType: instance
      HealthCheckEnabled: 'true'
      HealthCheckIntervalSeconds: 10
      HealthCheckPath: /metrics
      HealthCheckPort: '8000'
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 6
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      VpcId: !GetAtt
        - CustomSourceGetVpcDetails
        - VpcId
      Targets: []
  AktoKafkaListener:
    Type: 'AWS::ElasticLoadBalancingV2::Listener'
    Properties:
      LoadBalancerArn: !Ref AktoNLB
      Port: '9092'
      Protocol: TCP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AktoKafkaTargetGroup
  # Data ingestion HTTP service (host port 9091), exposed on the NLB
  AktoDataIngestionTargetGroup:
    Type: 'AWS::ElasticLoadBalancingV2::TargetGroup'
    Properties:
      Port: '9091'
      Protocol: TCP
      TargetType: instance
      HealthCheckEnabled: 'true'
      HealthCheckProtocol: TCP
      HealthCheckPort: '9091'
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      VpcId: !GetAtt CustomSourceGetVpcDetails.VpcId
  AktoDataIngestionListener:
    Type: 'AWS::ElasticLoadBalancingV2::Listener'
    Properties:
      LoadBalancerArn: !Ref AktoNLB
      Port: '9091'
      Protocol: TCP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AktoDataIngestionTargetGroup
  # PrivateLink: exposes AktoNLB (data ingestion 9091) to the allowed accounts.
  # Created only when PrivateLinkAllowedAccountIds is set. Consumers use the
  # consumer template and call their endpoint's DNS name on port 9091.
  AktoEndpointService:
    Type: 'AWS::EC2::VPCEndpointService'
    Condition: EnablePrivateLink
    Properties:
      NetworkLoadBalancerArns:
        - !Ref AktoNLB
      AcceptanceRequired: false
  AktoEndpointServicePermissions:
    Type: 'AWS::EC2::VPCEndpointServicePermissions'
    Condition: EnablePrivateLink
    Properties:
      ServiceId: !Ref AktoEndpointService
      # 111,222 -> arn:aws:iam::111:root,arn:aws:iam::222:root
      AllowedPrincipals: !Split
        - ','
        - !Sub
          - 'arn:aws:iam::${Ids}:root'
          - Ids: !Join
              - ':root,arn:aws:iam::'
              - !Ref PrivateLinkAllowedAccountIds
  DashboardInstanceRefreshHandler:
    Type: 'AWS::Lambda::Function'
    Properties:
      Handler: index.handler
      Runtime: nodejs24.x
      Timeout: 30
      Role: !GetAtt
        - InstanceRefreshHandlerLambdaRole
        - Arn
      Code:
        ZipFile: |
          const { AutoScalingClient, StartInstanceRefreshCommand } = require('@aws-sdk/client-auto-scaling');
          const autoscaling = new AutoScalingClient({});

          exports.handler = async () => {
            try {
              const data = await autoscaling.send(new StartInstanceRefreshCommand({
                AutoScalingGroupName: 'AktoDashboardAutoScalingGroup',
                Preferences: { InstanceWarmup: 200, MinHealthyPercentage: 0 },
              }));
              console.log(data);
            } catch (err) {
              console.log(err);
            }
          };
  TrafficMirroringInstanceRefreshHandler:
    Type: 'AWS::Lambda::Function'
    Properties:
      Handler: index.handler
      Runtime: nodejs24.x
      Timeout: 30
      Role: !GetAtt
        - InstanceRefreshHandlerLambdaRole
        - Arn
      Code:
        ZipFile: |
          const { AutoScalingClient, StartInstanceRefreshCommand } = require('@aws-sdk/client-auto-scaling');
          const autoscaling = new AutoScalingClient({});

          exports.handler = async () => {
            try {
              const data = await autoscaling.send(new StartInstanceRefreshCommand({
                AutoScalingGroupName: 'AktoAutoScalingGroup',
                Preferences: { InstanceWarmup: 200, MinHealthyPercentage: 0 },
              }));
              console.log(data);
            } catch (err) {
              console.log(err);
            }
          };
  InstanceRefreshHandlerLambdaRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Path: /service-role/
      Policies:
        - PolicyName: lambdaExecution-DashboardInstanceRefreshHandler
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                # These Describe actions do not support resource-level permissions
                Action:
                  - 'autoscaling:Describe*'
                  - 'ec2:DescribeLaunchTemplates'
                Resource: '*'
  # Separate from the role to avoid a circular dependency (role -> ASG -> instance profile -> Lambdas -> role)
  InstanceRefreshHandlerScopedPolicy:
    Type: 'AWS::IAM::Policy'
    Properties:
      PolicyName: lambdaExecution-InstanceRefreshHandlerScoped
      Roles:
        - !Ref InstanceRefreshHandlerLambdaRole
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - 'logs:CreateLogGroup'
              - 'logs:CreateLogStream'
              - 'logs:PutLogEvents'
            Resource:
              - !Sub >-
                arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${DashboardInstanceRefreshHandler}:*
              - !Sub >-
                arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${TrafficMirroringInstanceRefreshHandler}:*
          - Effect: Allow
            Action:
              - 'autoscaling:StartInstanceRefresh'
              - 'autoscaling:UpdateAutoScalingGroup'
            Resource:
              - !Sub >-
                arn:aws:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/${AktoAutoScalingGroup}
              - !Sub >-
                arn:aws:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/AktoDashboardAutoScalingGroup
          - Effect: Allow
            Action:
              - 'ec2:CreateLaunchTemplateVersion'
            Resource: !Sub >-
              arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${AktoLaunchTemplate}
  # Separate from the role to avoid a circular dependency
  # (role -> security group -> VPC lookup -> Lambda -> role)
  GetVpcDetailsLambdaSecurityGroupPolicy:
    Type: 'AWS::IAM::Policy'
    Properties:
      PolicyName: ConfigureAktoSecurityGroup
      Roles:
        - !Ref GetVpcDetailsLambdaRole
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - 'ec2:AuthorizeSecurityGroupIngress'
            Resource: !Sub >-
              arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/${AktoSecurityGroup}
  CustomSourceConfigureSecurityGroups:
    Type: 'AWS::CloudFormation::CustomResource'
    DependsOn:
      - GetVpcDetailsLambdaLogsPolicy
      - GetVpcDetailsLambdaSecurityGroupPolicy
    Properties:
      ServiceToken: !GetAtt GetVpcDetailsLambda.Arn
      SecurityGroupId: !Ref AktoSecurityGroup
      # protocol:port opened from every VPC CIDR. To open a new port, add it here and
      # update the stack; the Lambda re-runs and adds only the missing rules.
      Ports:
        - 'tcp:22'
        - 'udp:4789'
        - 'tcp:8000'
        - 'tcp:9092'
        - 'tcp:9091'
Outputs:
  AktoNLB:
    Description: The IP address of the AktoNLB
    Value: !GetAtt
      - AktoNLB
      - DNSName
    Export:
      Name: AktoNLBIP
  EndpointServiceName:
    Condition: EnablePrivateLink
    Description: Give this to each consumer account (EndpointServiceName parameter of the consumer stack)
    Value: !Sub 'com.amazonaws.vpce.${AWS::Region}.${AktoEndpointService}'
  DataIngestionUrl:
    Description: >-
      Data ingestion endpoint for clients in this VPC. Clients in consumer VPCs
      use the DataIngestionUrl output of their consumer stack.
    Value: !Sub 'http://${AktoNLB.DNSName}:9091'