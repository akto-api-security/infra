AWSTemplateFormatVersion: 2010-09-09
Description: >-
  This template does a simple setup for all Akto modules. It sets up all modules
  on a single instance. If you want a scalable and flexible setup, please
  contact support@akto.io.
Parameters:
  SubnetId:
    Type: 'AWS::EC2::Subnet::Id'
  KeyPair:
    Type: 'AWS::EC2::KeyPair::KeyName'
  DatabaseAbstractorUrl:
    Type: String
  DatabaseAbstractorToken:
    Type: String
    NoEcho: true
Mappings:
  RegionMap:
    af-south-1:
      AMI: ami-093ca241e4c72c205
    eu-north-1:
      AMI: ami-0f58e72599cb99a79
    ap-south-1:
      AMI: ami-0400aca7799d8cf19
    eu-west-3:
      AMI: ami-064c70d04ad799d5e
    eu-west-2:
      AMI: ami-0dfe6158087b5c0ac
    eu-south-1:
      AMI: ami-07b2af763a8b958f3
    eu-west-1:
      AMI: ami-047aad752a426ed48
    ap-northeast-3:
      AMI: ami-0cffa2172948e071e
    ap-northeast-2:
      AMI: ami-087af0192368bc87c
    me-south-1:
      AMI: ami-0a31e56929248acca
    ap-northeast-1:
      AMI: ami-0828596b82405edd7
    sa-east-1:
      AMI: ami-0df67b3c17f090c24
    ca-central-1:
      AMI: ami-0eb3718c42cb70e52
    ap-east-1:
      AMI: ami-0e992f1e63814db10
    ap-southeast-1:
      AMI: ami-0ba98499caf94125a
    ap-southeast-2:
      AMI: ami-0849cc8fe4ceaf988
    eu-central-1:
      AMI: ami-0f7585ae7a0d9a25a
    ap-southeast-3:
      AMI: ami-0cf40308729b83366
    us-east-1:
      AMI: ami-0d52ddcdf3a885741
    us-east-2:
      AMI: ami-04148302a14f7d12b
    us-west-1:
      AMI: ami-0ee3e1e65adeef858
    us-west-2:
      AMI: ami-0ec021424fb596d6c
Resources:
  DatabaseAbstractorTokenSecret:
    Type: 'AWS::SecretsManager::Secret'
    Properties:
      Description: Akto Database Abstractor service token
      SecretString: !Ref DatabaseAbstractorToken
  GetAktoSetupDetailsLambdaBasicExecutionRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      Path: /
      Policies:
        - PolicyName: GetAktoSetupDetailsExecuteLambda
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                # These Describe actions do not support resource-level permissions
                Action:
                  - 'ec2:DescribeNetworkInterfaces'
                  - 'ec2:DescribeTrafficMirrorSessions'
                  - 'ec2:DescribeInstances'
                  - 'ec2:DescribeVpcs'
                  - 'elasticloadbalancing:DescribeLoadBalancers'
                  - 'elasticloadbalancing:DescribeTargetGroups'
                  - 'elasticloadbalancing:DescribeTargetHealth'
                Resource: '*'
  GetAktoSetupDetails:
    Type: 'AWS::Lambda::Function'
    Properties:
      Runtime: nodejs24.x
      Timeout: 60
      Role: !GetAtt
        - GetAktoSetupDetailsLambdaBasicExecutionRole
        - Arn
      Handler: index.handler
      Environment:
        Variables:
          TARGET_LB: !Ref AktoNLB
      Code:
        S3Bucket: !Sub 'akto-setup-${AWS::Region}'
        S3Key: templates/get-akto-setup-details-v3.zip
  GetVpcDetailsLambdaRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Path: /
      Policies:
        - PolicyName: DescribeAssetsPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                # These Describe actions do not support resource-level permissions
                Action:
                  - 'ec2:DescribeVpcs'
                  - 'ec2:DescribeSubnets'
                Resource: '*'
  GetVpcDetailsLambda:
    Type: 'AWS::Lambda::Function'
    Properties:
      Description: Look up info from a VPC
      Handler: index.handler
      Runtime: nodejs24.x
      Timeout: 30
      Role: !GetAtt
        - GetVpcDetailsLambdaRole
        - Arn
      Environment:
        Variables:
          SUBNET_ID: !Ref SubnetId
      Code:
        ZipFile: |
          const { EC2Client, DescribeSubnetsCommand } = require('@aws-sdk/client-ec2');
          const ec2 = new EC2Client({});

          async function sendResponse(event, context, status, data, reason) {
            const body = JSON.stringify({
              Status: status,
              Reason: reason || `See CloudWatch log stream: ${context.logStreamName}`,
              PhysicalResourceId: event.PhysicalResourceId || context.logStreamName,
              StackId: event.StackId,
              RequestId: event.RequestId,
              LogicalResourceId: event.LogicalResourceId,
              Data: data || {},
            });
            await fetch(event.ResponseURL, { method: 'PUT', headers: { 'Content-Type': '' }, body });
          }

          exports.handler = async (event, context) => {
            try {
              if (event.RequestType === 'Delete') {
                await sendResponse(event, context, 'SUCCESS');
                return;
              }
              const subnetId = process.env.SUBNET_ID;
              console.log('Looking up VPC for subnet', subnetId);
              const resp = await ec2.send(new DescribeSubnetsCommand({ SubnetIds: [subnetId] }));
              const subnet = resp.Subnets && resp.Subnets[0];
              if (!subnet) {
                throw new Error('Could not find subnet ' + subnetId);
              }
              console.log('Found VpcId', subnet.VpcId);
              await sendResponse(event, context, 'SUCCESS', { VpcId: subnet.VpcId });
            } catch (err) {
              console.error(err);
              await sendResponse(event, context, 'FAILED', {}, String(err));
            }
          };
  # Separate from the role to avoid a circular dependency (role -> Lambda name -> role)
  GetVpcDetailsLambdaLogsPolicy:
    Type: 'AWS::IAM::Policy'
    Properties:
      PolicyName: GetVpcDetailsLambdaLogs
      Roles:
        - !Ref GetVpcDetailsLambdaRole
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - 'logs:CreateLogGroup'
              - 'logs:CreateLogStream'
              - 'logs:PutLogEvents'
            Resource: !Sub >-
              arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${GetVpcDetailsLambda}:*
  CustomSourceGetVpcDetails:
    Type: 'AWS::CloudFormation::CustomResource'
    DependsOn: GetVpcDetailsLambdaLogsPolicy
    Properties:
      ServiceToken: !GetAtt
        - GetVpcDetailsLambda
        - Arn
  IamInstanceProfile:
    Type: 'AWS::IAM::InstanceProfile'
    Properties:
      Path: /
      Roles:
        - !Ref RefreshHandlerLambdaBasicExecutionRole
  RefreshHandlerLambdaBasicExecutionRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: InvokeLambdaPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Resource:
                  - !GetAtt
                    - DashboardInstanceRefreshHandler
                    - Arn
                  - !GetAtt
                    - TrafficMirroringInstanceRefreshHandler
                    - Arn
                Action: 'lambda:InvokeFunction'
        - PolicyName: ReadDatabaseAbstractorTokenSecret
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: 'secretsmanager:GetSecretValue'
                Resource: !Ref DatabaseAbstractorTokenSecret
  AktoSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      VpcId: !GetAtt
        - CustomSourceGetVpcDetails
        - VpcId
      GroupDescription: 'Enable the ports Akto requires (22, 4789, 8000, 9092)'
      SecurityGroupIngress: []
      SecurityGroupEgress: []

  AktoLaunchTemplate:
    Type: 'AWS::EC2::LaunchTemplate'
    Properties:
      LaunchTemplateName: AktoLaunchTemplate
      LaunchTemplateData:
        ImageId: !FindInMap
          - RegionMap
          - !Ref 'AWS::Region'
          - AMI
        InstanceType: m5a.xlarge
        KeyName: !Ref KeyPair
        NetworkInterfaces:
          - AssociatePublicIpAddress: false
            SubnetId: !Ref SubnetId
            DeviceIndex: 0
            Groups:
              - !Ref AktoSecurityGroup
        IamInstanceProfile:
          Arn: !GetAtt IamInstanceProfile.Arn
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeType: gp2
              DeleteOnTermination: true
              VolumeSize: 50
              Encrypted: true
        MetadataOptions:
          HttpTokens: required
        UserData: !Base64
          Fn::Join:
            - "\n"
            - - '#!/bin/bash -xe'
              - !Sub "export DATABASE_ABSTRACTOR_SERVICE_URL=${DatabaseAbstractorUrl}"
              - sudo yum install -y awscli || true
              - !Sub >-
                DATABASE_ABSTRACTOR_SERVICE_TOKEN=$(aws secretsmanager get-secret-value
                --secret-id ${DatabaseAbstractorTokenSecret} --region ${AWS::Region}
                --query SecretString --output text)
              - '[ -n "$DATABASE_ABSTRACTOR_SERVICE_TOKEN" ] || { echo "Failed to read DatabaseAbstractorToken from Secrets Manager"; exit 1; }'
              - export DATABASE_ABSTRACTOR_SERVICE_TOKEN
              - !Sub "export AKTO_KAFKA_IP=${AktoNLB.DNSName}"
              - touch /tmp/hello.txt
              - touch ~/hello.txt
              - sudo yum update -y
              - sudo yum install -y python python-setuptools
              - sudo yum install -y docker
              - sudo dockerd&
              - sudo systemctl enable /usr/lib/systemd/system/docker.service
              - sudo mkdir -p /opt/aws/bin
              - export COMPOSE_FILE=docker-compose-mini-runtime.yml
              - >-
                sudo wget
                https://s3.amazonaws.com/cloudformation-examples/aws-cfn-bootstrap-latest.tar.gz
              - >-
                sudo python -m easy_install --script-dir /opt/aws/bin
                aws-cfn-bootstrap-latest.tar.gz
              - >-
                curl -fsSL
                'https://raw.githubusercontent.com/akto-api-security/infra/feature/mini-runtime-cft/cf-deploy-akto'
                > cf-deploy-akto
              - sudo chmod 700 cf-deploy-akto
              - ./cf-deploy-akto < <(echo 'test')
              - sudo echo " " >> ~/akto/infra/docker-runtime.env
              - >-
                sudo echo AKTO_MONGO_CONN=$AKTO_MONGO_CONN >>
                ~/akto/infra/docker-runtime.env
              - sudo echo " " >> ~/akto/infra/docker-mini-runtime.env
              - >-
                sudo echo DATABASE_ABSTRACTOR_SERVICE_URL=$DATABASE_ABSTRACTOR_SERVICE_URL >>
                ~/akto/infra/docker-mini-runtime.env
              - >-
                sudo echo DATABASE_ABSTRACTOR_SERVICE_TOKEN=$DATABASE_ABSTRACTOR_SERVICE_TOKEN >>
                ~/akto/infra/docker-mini-runtime.env
              - sudo echo AKTO_KAFKA_IP=$AKTO_KAFKA_IP >> ~/akto/infra/.env
              - >-
                sudo sed -i "s/AKTO_THREAT_PROTECTION_BACKEND_TOKEN=.*/AKTO_THREAT_PROTECTION_BACKEND_TOKEN=$DATABASE_ABSTRACTOR_SERVICE_TOKEN/"
                ~/akto/infra/docker-threat-detection.env
              - >-
                sudo sed -i "s/DATABASE_ABSTRACTOR_SERVICE_TOKEN=.*/DATABASE_ABSTRACTOR_SERVICE_TOKEN=$DATABASE_ABSTRACTOR_SERVICE_TOKEN/"
                ~/akto/infra/docker-threat-detection.env
              - >-
                curl -fsSL
                'https://raw.githubusercontent.com/akto-api-security/infra/feature/mini-runtime-cft/cf-deploy-akto-start'
                > cf-deploy-akto-start
              - sudo chmod 700 cf-deploy-akto-start
              - ./cf-deploy-akto-start < <(echo 'test')

  AktoAutoScalingGroup:
    Type: 'AWS::AutoScaling::AutoScalingGroup'
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref AktoLaunchTemplate
        Version: !GetAtt AktoLaunchTemplate.LatestVersionNumber
      VPCZoneIdentifier:
        - !Ref SubnetId
      TargetGroupARNs:
        - !Ref AktoTrafficMirroringTargetGroup
        - !Ref AktoKafkaTargetGroup
      MaxSize: '10'
      MinSize: '1'
  AktoTargetTrackingNetworkPolicy:
    Type: 'AWS::AutoScaling::ScalingPolicy'
    Properties:
      PolicyType: TargetTrackingScaling
      AutoScalingGroupName: !Ref AktoAutoScalingGroup
      EstimatedInstanceWarmup: 30
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageNetworkIn
        TargetValue: 200000000
  AktoNLB:
    Type: 'AWS::ElasticLoadBalancingV2::LoadBalancer'
    Properties:
      Type: network
      Scheme: internal
      IpAddressType: ipv4
      Subnets:
        - !Ref SubnetId
      LoadBalancerAttributes:
        - Key: load_balancing.cross_zone.enabled
          Value: 'true'
  AktoTrafficMirroringTargetGroup:
    Type: 'AWS::ElasticLoadBalancingV2::TargetGroup'
    Properties:
      Port: '4789'
      Protocol: UDP
      HealthCheckEnabled: 'true'
      HealthCheckIntervalSeconds: 10
      HealthCheckPath: /metrics
      HealthCheckPort: '8000'
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 6
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      TargetType: instance
      VpcId: !GetAtt
        - CustomSourceGetVpcDetails
        - VpcId
      Targets: []
  AktoKafkaTargetGroup:
    Type: 'AWS::ElasticLoadBalancingV2::TargetGroup'
    Properties:
      Port: '9092'
      Protocol: TCP
      TargetType: instance
      HealthCheckEnabled: 'true'
      HealthCheckIntervalSeconds: 10
      HealthCheckPath: /metrics
      HealthCheckPort: '8000'
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 6
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      VpcId: !GetAtt
        - CustomSourceGetVpcDetails
        - VpcId
      Targets: []
  AktoKafkaListener:
    Type: 'AWS::ElasticLoadBalancingV2::Listener'
    Properties:
      LoadBalancerArn: !Ref AktoNLB
      Port: '9092'
      Protocol: TCP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AktoKafkaTargetGroup
  DashboardInstanceRefreshHandler:
    Type: 'AWS::Lambda::Function'
    Properties:
      Handler: index.handler
      Runtime: nodejs24.x
      Timeout: 30
      Role: !GetAtt
        - InstanceRefreshHandlerLambdaRole
        - Arn
      Code:
        ZipFile: |
          const { AutoScalingClient, StartInstanceRefreshCommand } = require('@aws-sdk/client-auto-scaling');
          const autoscaling = new AutoScalingClient({});

          exports.handler = async () => {
            try {
              const data = await autoscaling.send(new StartInstanceRefreshCommand({
                AutoScalingGroupName: 'AktoDashboardAutoScalingGroup',
                Preferences: { InstanceWarmup: 200, MinHealthyPercentage: 0 },
              }));
              console.log(data);
            } catch (err) {
              console.log(err);
            }
          };
  TrafficMirroringInstanceRefreshHandler:
    Type: 'AWS::Lambda::Function'
    Properties:
      Handler: index.handler
      Runtime: nodejs24.x
      Timeout: 30
      Role: !GetAtt
        - InstanceRefreshHandlerLambdaRole
        - Arn
      Code:
        ZipFile: |
          const { AutoScalingClient, StartInstanceRefreshCommand } = require('@aws-sdk/client-auto-scaling');
          const autoscaling = new AutoScalingClient({});

          exports.handler = async () => {
            try {
              const data = await autoscaling.send(new StartInstanceRefreshCommand({
                AutoScalingGroupName: 'AktoAutoScalingGroup',
                Preferences: { InstanceWarmup: 200, MinHealthyPercentage: 0 },
              }));
              console.log(data);
            } catch (err) {
              console.log(err);
            }
          };
  InstanceRefreshHandlerLambdaRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Path: /service-role/
      Policies:
        - PolicyName: lambdaExecution-DashboardInstanceRefreshHandler
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                # These Describe actions do not support resource-level permissions
                Action:
                  - 'autoscaling:Describe*'
                  - 'ec2:DescribeLaunchTemplates'
                Resource: '*'
  # Separate from the role to avoid a circular dependency (role -> ASG -> instance profile -> Lambdas -> role)
  InstanceRefreshHandlerScopedPolicy:
    Type: 'AWS::IAM::Policy'
    Properties:
      PolicyName: lambdaExecution-InstanceRefreshHandlerScoped
      Roles:
        - !Ref InstanceRefreshHandlerLambdaRole
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - 'logs:CreateLogGroup'
              - 'logs:CreateLogStream'
              - 'logs:PutLogEvents'
            Resource:
              - !Sub >-
                arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${DashboardInstanceRefreshHandler}:*
              - !Sub >-
                arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${TrafficMirroringInstanceRefreshHandler}:*
          - Effect: Allow
            Action:
              - 'autoscaling:StartInstanceRefresh'
              - 'autoscaling:UpdateAutoScalingGroup'
            Resource:
              - !Sub >-
                arn:aws:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/${AktoAutoScalingGroup}
              - !Sub >-
                arn:aws:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/AktoDashboardAutoScalingGroup
          - Effect: Allow
            Action:
              - 'ec2:CreateLaunchTemplateVersion'
            Resource: !Sub >-
              arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${AktoLaunchTemplate}
  ConfigureSecurityGroupsLambda:
    Type: 'AWS::Lambda::Function'
    Properties:
      Description: >-
        Configure Security Groups for Runtime processor and Context analyzer
        instances
      Handler: lambda.lambda_handler
      Runtime: python3.13
      Timeout: 30
      Role: !GetAtt
        - ConfigureSecurityGroupsLambdaRole
        - Arn
      Environment:
        Variables:
          SUBNET_ID: !Ref SubnetId
          CONTEXT_ANALYZER_SECURITY_GROUP_ID: !Ref AktoSecurityGroup
          RUNTIME_PROCESSOR_SECURITY_GROUP_ID: !Ref AktoSecurityGroup
          MODE: RUNTIME
      Code:
        S3Bucket: !Sub 'akto-setup-${AWS::Region}'
        S3Key: templates/configure_security_groups.zip
  CustomSourceConfigureSecurityGroupsLambda:
    Type: 'AWS::CloudFormation::CustomResource'
    DependsOn: ConfigureSecurityGroupsLambdaLogsPolicy
    Properties:
      ServiceToken: !GetAtt
        - ConfigureSecurityGroupsLambda
        - Arn
  ConfigureSecurityGroupsLambdaRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Path: /
      Policies:
        - PolicyName: DescribeAssetsPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                # These Describe actions do not support resource-level permissions
                Action:
                  - 'ec2:DescribeVpcs'
                  - 'ec2:DescribeSubnets'
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'ec2:AuthorizeSecurityGroupIngress'
                Resource:
                  - !Sub >-
                    arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/${AktoSecurityGroup}
  # Separate from the role to avoid a circular dependency (role -> Lambda name -> role)
  ConfigureSecurityGroupsLambdaLogsPolicy:
    Type: 'AWS::IAM::Policy'
    Properties:
      PolicyName: AWSLambdaBasicExecutionRole
      Roles:
        - !Ref ConfigureSecurityGroupsLambdaRole
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - 'logs:CreateLogGroup'
              - 'logs:CreateLogStream'
              - 'logs:PutLogEvents'
            Resource: !Sub >-
              arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ConfigureSecurityGroupsLambda}:*
Outputs:
  AktoNLB:
    Description: The IP address of the AktoNLB
    Value: !GetAtt
      - AktoNLB
      - DNSName
    Export:
      Name: AktoNLBIP