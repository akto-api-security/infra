AWSTemplateFormatVersion: 2010-09-09
Description: >-
  Akto mini-runtime PrivateLink consumer. Run in each account (once per VPC)
  whose clients call Akto data ingestion. Creates an interface endpoint to the
  Akto endpoint service. Clients call the DataIngestionUrl output (the
  endpoint's DNS name on port 9091).
Parameters:
  EndpointServiceName:
    Type: String
    Description: >-
      EndpointServiceName output of the mini-runtime stack
      (com.amazonaws.vpce.<region>.vpce-svc-xxxxxxxx).
  VpcId:
    Type: 'AWS::EC2::VPC::Id'
    Description: VPC where the clients run. Needs DNS resolution enabled.
  SubnetIds:
    Type: 'List<AWS::EC2::Subnet::Id>'
    Description: >-
      Subnets for the endpoint, at most one per AZ. If the mini-runtime stack is
      in this same region, each must be in an AZ (matched by AZ ID) where the
      mini-runtime NLB has a subnet.
  IngressCidr:
    Type: String
    Description: CIDR allowed to reach the endpoint on TCP 9091 (e.g. this VPC's CIDR).
  ServiceRegion:
    Type: String
    Default: ''
    Description: >-
      Optional. Region of the mini-runtime stack (its EndpointServiceRegion
      output), only if it differs from this stack's region. Leave empty if both
      are in the same region.
Conditions:
  HasServiceRegion: !Not [!Equals [!Ref ServiceRegion, '']]
Resources:
  AktoEndpointSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: Akto NLB PrivateLink endpoint (TCP 9091)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 9091
          ToPort: 9091
          CidrIp: !Ref IngressCidr
          Description: Clients to Akto data ingestion (HTTP)
  AktoVpcEndpoint:
    Type: 'AWS::EC2::VPCEndpoint'
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Ref EndpointServiceName
      # Cross-region PrivateLink: region of the endpoint service, when it is not this region
      ServiceRegion: !If [HasServiceRegion, !Ref ServiceRegion, !Ref 'AWS::NoValue']
      VpcId: !Ref VpcId
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds:
        - !Ref AktoEndpointSecurityGroup
      PrivateDnsEnabled: false
Outputs:
  VpcEndpointId:
    Value: !Ref AktoVpcEndpoint
  DataIngestionUrl:
    Description: Clients in this VPC call this URL
    # The first DnsEntries item is the regional name, formatted "<zoneId>:<dnsName>"
    Value: !Sub
      - 'http://${DnsName}:9091'
      - DnsName: !Select [1, !Split [':', !Select [0, !GetAtt AktoVpcEndpoint.DnsEntries]]]
