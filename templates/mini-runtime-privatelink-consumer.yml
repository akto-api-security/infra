AWSTemplateFormatVersion: 2010-09-09
Description: >-
  Akto mini-runtime PrivateLink consumer. Run in each account (once per VPC)
  that sends traffic to Akto. Creates an interface endpoint to the Akto
  endpoint service and a private hosted zone so NlbHostname resolves to this
  endpoint. Clients use NlbHostname:9092 (Kafka) and NlbHostname:9091 (data
  ingestion).
Parameters:
  EndpointServiceName:
    Type: String
    Description: >-
      EndpointServiceName output of the provider stack
      (com.amazonaws.vpce.<region>.vpce-svc-xxxxxxxx).
  VpcId:
    Type: 'AWS::EC2::VPC::Id'
    Description: VPC where the Akto agents run. Needs DNS resolution and DNS hostnames enabled.
  SubnetIds:
    Type: 'List<AWS::EC2::Subnet::Id>'
    Description: >-
      Subnets for the endpoint, at most one per AZ. At least one must be in an
      AZ ID listed in the provider's NlbAvailabilityZoneIds output.
  IngressCidr:
    Type: String
    Description: CIDR allowed to reach the endpoint on TCP 9092 and 9091 (e.g. this VPC's CIDR).
  NlbHostname:
    Type: String
    Default: aktonlb.internal
    Description: Must match NlbHostname in the mini-runtime stack.
Resources:
  AktoEndpointSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: Akto NLB PrivateLink endpoint (TCP 9092, 9091)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 9092
          ToPort: 9092
          CidrIp: !Ref IngressCidr
          Description: Akto agents to Kafka
        - IpProtocol: tcp
          FromPort: 9091
          ToPort: 9091
          CidrIp: !Ref IngressCidr
          Description: Clients to Akto data ingestion (HTTP)
  AktoVpcEndpoint:
    Type: 'AWS::EC2::VPCEndpoint'
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Ref EndpointServiceName
      VpcId: !Ref VpcId
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds:
        - !Ref AktoEndpointSecurityGroup
      PrivateDnsEnabled: false
  AktoNlbHostedZone:
    Type: 'AWS::Route53::HostedZone'
    Properties:
      Name: !Ref NlbHostname
      HostedZoneConfig:
        Comment: Akto NLB hostname -> Akto PrivateLink endpoint
      VPCs:
        - VPCId: !Ref VpcId
          VPCRegion: !Ref 'AWS::Region'
  AktoNlbRecord:
    Type: 'AWS::Route53::RecordSet'
    Properties:
      HostedZoneId: !Ref AktoNlbHostedZone
      Name: !Ref NlbHostname
      Type: A
      # The first DnsEntries item is the regional name, formatted "<zoneId>:<dnsName>"
      AliasTarget:
        HostedZoneId: !Select [0, !Split [':', !Select [0, !GetAtt AktoVpcEndpoint.DnsEntries]]]
        DNSName: !Select [1, !Split [':', !Select [0, !GetAtt AktoVpcEndpoint.DnsEntries]]]
        EvaluateTargetHealth: false
Outputs:
  VpcEndpointId:
    Value: !Ref AktoVpcEndpoint
  KafkaBootstrap:
    Description: Configure Akto agents with this bootstrap server
    Value: !Sub '${NlbHostname}:9092'
