AWSTemplateFormatVersion: "2010-09-09"
Description:
  This template does a quick setup of Akto modules. It sets up Akto dashboard and mongo on seperate ec2 instances. If you want a flexible setup, please
  contact support@akto.io.
Parameters:
  PrivateSubnetId:
    Description:
     Select a private subnetid where Akto EC2 instances will be deployed
    Type: AWS::EC2::Subnet::Id
    ConstraintDescription: must be an existing subnet
  KeyPair:
    Description: Select the key pair to connect to Mongo cluster
    Type: AWS::EC2::KeyPair::KeyName
Mappings:
  RegionMap:
    "af-south-1":
      AMI: "ami-093ca241e4c72c205"
    "eu-north-1":
      AMI: "ami-0f58e72599cb99a79"
    "ap-south-1":
      AMI: "ami-0400aca7799d8cf19"
    "eu-west-3":
      AMI: "ami-064c70d04ad799d5e"
    "eu-west-2":
      AMI: "ami-0dfe6158087b5c0ac"
    "eu-south-1":
      AMI: "ami-07b2af763a8b958f3"
    "eu-west-1":
      AMI: "ami-047aad752a426ed48"
    "ap-northeast-3":
      AMI: "ami-0cffa2172948e071e"
    "ap-northeast-2":
      AMI: "ami-087af0192368bc87c"
    "me-south-1":
      AMI: "ami-0a31e56929248acca"
    "ap-northeast-1":
      AMI: "ami-0828596b82405edd7"
    "sa-east-1":
      AMI: "ami-0df67b3c17f090c24"
    "ca-central-1":
      AMI: "ami-0eb3718c42cb70e52"
    "ap-east-1":
      AMI: "ami-0e992f1e63814db10"
    "ap-southeast-1":
      AMI: "ami-0ba98499caf94125a"
    "ap-southeast-2":
      AMI: "ami-0849cc8fe4ceaf988"
    "eu-central-1":
      AMI: "ami-0f7585ae7a0d9a25a"
    "ap-southeast-3":
      AMI: "ami-0cf40308729b83366"
    "us-east-1":
      AMI: "ami-0d52ddcdf3a885741"
    "us-east-2":
      AMI: "ami-04148302a14f7d12b"
    "us-west-1":
      AMI: "ami-0ee3e1e65adeef858"
    "us-west-2":
