Resources:
  ## Setting up VpcDetailsLambda
  GetVpcDetailsLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole
      Path: "/"
      Policies:
      - PolicyName: DescribeAssetsPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - ec2:DescribeVpcs
            - ec2:DescribeSubnets
            Resource: "*"
  GetVpcDetailsLambda:
    Type: AWS::Lambda::Function
    Properties:
      Description: Look up info from a VPC and update deployment status
      Handler: index.lambda_handler
      Runtime: python3.9
      Timeout: 30
      Role:
        Fn::GetAtt:
        - GetVpcDetailsLambdaRole
        - Arn
      Environment:
        Variables:
          SUBNET_ID:
            Ref: PrivateSubnetId
      Code:
        ZipFile: |
          import json 
          import urllib3
          import os 
          import cfnresponse 
          import logging 
          import boto3

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          http = urllib3.PoolManager()

          def lambda_handler(event, context):
            if event.get('RequestType') == 'Delete':
              responseData = {}
              responseData['message'] = 'Deleting lambda'
              cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData)
              return

            fetch_vpc_details_resp = fetch_vpc_details()
            
            cfnresponse.send(event, context, cfnresponse.SUCCESS, fetch_vpc_details_resp)

          def fetch_vpc_details():
            subnet_id = os.environ['SUBNET_ID']
            ec2 = boto3.client('ec2')

            subnets = ec2.describe_subnets(
              SubnetIds = [subnet_id]
            )
            vpcId = subnets['Subnets'][0]['VpcId']
            vpc_response = ec2.describe_vpcs(VpcIds=[vpcId])
            cidr_block = vpc_response['Vpcs'][0]['CidrBlock']

            return {
              'VpcId': vpcId,    
              'CidrBlock': cidr_block             
            }
          
  CustomSourceGetVpcDetails:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken:
        Fn::GetAtt:
        - GetVpcDetailsLambda
        - Arn 
  ## Setting up mongo
  AktoMongoSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: 
        Fn::GetAtt:
        - CustomSourceGetVpcDetails
        - VpcId
      GroupDescription: Enable the ports Mongo requires (22, 27017)
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 22
        ToPort: 22
        CidrIp:
          Fn::GetAtt:
          - CustomSourceGetVpcDetails
          - CidrBlock
      - IpProtocol: tcp
        FromPort: 27017
        ToPort: 27017
        CidrIp:
          Fn::GetAtt:
          - CustomSourceGetVpcDetails
          - CidrBlock
      SecurityGroupEgress: []
  AktoMongoLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !FindInMap [RegionMap, !Ref "AWS::Region", AMI]
        InstanceType: m6a.large
        KeyName:
          Ref: KeyPair
        NetworkInterfaces:
          - SubnetId: !Ref PrivateSubnetId
            AssociatePublicIpAddress: "false"
            DeviceIndex: 0
            Groups: [!Ref AktoMongoSecurityGroup]
        BlockDeviceMappings:
          - DeviceName: "/dev/xvda"
            Ebs:
              VolumeType: gp3
              DeleteOnTermination: "false"
              VolumeSize: "50"
              Encrypted: true
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 2
  AktoMongoPrimaryInstance:
    Type: AWS::EC2::Instance
    DependsOn: 
      - AktoMongoSecondary1Instance
      - AktoMongoSecondary2Instance
    Properties:
      Tags:
        - Key: Name
          Value: Akto Mongo Primary instance
      LaunchTemplate:
        LaunchTemplateId: !Ref AktoMongoLaunchTemplate
        Version: !GetAtt AktoMongoLaunchTemplate.LatestVersionNumber
      UserData:
          Fn::Base64:
            Fn::Join:
              - "\n"
              - - "#!/bin/bash -xe"
                - touch /tmp/hello.txt
                - touch ~/hello.txt
                - sudo yum update -y
                - sudo yum install -y python python-setuptools
                - sudo yum install -y docker
                - sudo dockerd&
                - sudo mkdir -p /opt/aws/bin
                - sudo wget https://s3.amazonaws.com/cloudformation-examples/aws-cfn-bootstrap-latest.tar.gz
                - sudo python -m easy_install --script-dir /opt/aws/bin aws-cfn-bootstrap-latest.tar.gz
                - export COMPOSE_FILE=docker-compose-mongo-cluster.yml
                - sudo systemctl enable /usr/lib/systemd/system/docker.service
                - curl -fsSL 'https://raw.githubusercontent.com/akto-api-security/infra/feature/quick-setup/cf-deploy-akto' > cf-deploy-akto
                - sudo chmod 700 cf-deploy-akto
                - "./cf-deploy-akto < <(echo 'test')"
                - 'TOKEN=`curl -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600"`'
                - 'PRIVATE_IP=$(curl -H "X-aws-ec2-metadata-token: $TOKEN" -v http://169.254.169.254/latest/meta-data/local-ipv4)'
                - sed -i "s/\${INSTANCE_IP}/$PRIVATE_IP/g" ~/akto/infra/docker-compose-mongo-cluster.yml
                - curl -fsSL 'https://raw.githubusercontent.com/akto-api-security/infra/feature/quick-setup/cf-deploy-akto-start' > cf-deploy-akto-start
                - sudo chmod 700 cf-deploy-akto-start
                - "./cf-deploy-akto-start < <(echo 'test')"
                - Fn::Sub: export AKTO_SEC_1_IP='${AktoMongoSecondary1Instance.PrivateIp}'
                - Fn::Sub: export AKTO_SEC_2_IP='${AktoMongoSecondary2Instance.PrivateIp}'
                - sleep 20
                - docker exec -i mongo mongosh --eval "rs.initiate()"
                - docker exec -i mongo mongosh --eval "rs.add('${AKTO_SEC_1_IP}:27017')"
                - docker exec -i mongo mongosh --eval "rs.add('${AKTO_SEC_2_IP}:27017')"
                - Fn::Join:
                  - ''
                  - - sudo /opt/aws/bin/cfn-signal -s true
                    - "         --stack "
                    - Ref: AWS::StackName
                    - "         --resource AktoMongoPrimaryInstance"
                    - "         --region "
                    - Ref: AWS::Region
    CreationPolicy:
      AutoScalingCreationPolicy:
        MinSuccessfulInstancesPercent: 100
      ResourceSignal:    
        Timeout: PT10M
  AktoMongoSecondary1Instance:
    Type: AWS::EC2::Instance
    Properties:
      Tags:
        - Key: Name
          Value: Akto Mongo Secondary 1 instance
      LaunchTemplate:
        LaunchTemplateId: !Ref AktoMongoLaunchTemplate
        Version: !GetAtt AktoMongoLaunchTemplate.LatestVersionNumber
      UserData:
        Fn::Base64:
          Fn::Join:
            - "\n"
            - - "#!/bin/bash -xe"
              - touch /tmp/hello.txt
              - touch ~/hello.txt
              - sudo yum update -y
              - sudo yum install -y python python-setuptools
              - sudo yum install -y docker
              - sudo dockerd&
              - sudo mkdir -p /opt/aws/bin
              - sudo wget https://s3.amazonaws.com/cloudformation-examples/aws-cfn-bootstrap-latest.tar.gz
              - sudo python -m easy_install --script-dir /opt/aws/bin aws-cfn-bootstrap-latest.tar.gz
              - export COMPOSE_FILE=docker-compose-mongo-cluster.yml
              - sudo systemctl enable /usr/lib/systemd/system/docker.service
              - curl -fsSL 'https://raw.githubusercontent.com/akto-api-security/infra/feature/quick-setup/cf-deploy-akto' > cf-deploy-akto
              - sudo chmod 700 cf-deploy-akto
              - "./cf-deploy-akto < <(echo 'test')"
              - 'TOKEN=`curl -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600"`'
              - 'PRIVATE_IP=$(curl -H "X-aws-ec2-metadata-token: $TOKEN" -v http://169.254.169.254/latest/meta-data/local-ipv4)'
              - sed -i "s/\${INSTANCE_IP}/$PRIVATE_IP/g" ~/akto/infra/docker-compose-mongo-cluster.yml
              - curl -fsSL 'https://raw.githubusercontent.com/akto-api-security/infra/feature/quick-setup/cf-deploy-akto-start' > cf-deploy-akto-start
              - sudo chmod 700 cf-deploy-akto-start
              - "./cf-deploy-akto-start < <(echo 'test')"
              - Fn::Join:
                - ''
                - - sudo /opt/aws/bin/cfn-signal -s true
                  - "         --stack "
                  - Ref: AWS::StackName
                  - "         --resource AktoMongoSecondary1Instance"
                  - "         --region "
                  - Ref: AWS::Region
    CreationPolicy:
      AutoScalingCreationPolicy:
        MinSuccessfulInstancesPercent: 100
      ResourceSignal:    
        Timeout: PT10M
  AktoMongoSecondary2Instance:
    Type: AWS::EC2::Instance
    Properties:
      Tags:
        - Key: Name
          Value: Akto Mongo Secondary 2 instance
      LaunchTemplate:
        LaunchTemplateId: !Ref AktoMongoLaunchTemplate
        Version: !GetAtt AktoMongoLaunchTemplate.LatestVersionNumber
      UserData:
        Fn::Base64:
          Fn::Join:
            - "\n"
            - - "#!/bin/bash -xe"
              - touch /tmp/hello.txt
              - touch ~/hello.txt
              - sudo yum update -y
              - sudo yum install -y python python-setuptools
              - sudo yum install -y docker
              - sudo dockerd&
              - sudo mkdir -p /opt/aws/bin
              - sudo wget https://s3.amazonaws.com/cloudformation-examples/aws-cfn-bootstrap-latest.tar.gz
              - sudo python -m easy_install --script-dir /opt/aws/bin aws-cfn-bootstrap-latest.tar.gz
              - export COMPOSE_FILE=docker-compose-mongo-cluster.yml
              - sudo systemctl enable /usr/lib/systemd/system/docker.service
              - curl -fsSL 'https://raw.githubusercontent.com/akto-api-security/infra/feature/quick-setup/cf-deploy-akto' > cf-deploy-akto
              - sudo chmod 700 cf-deploy-akto
              - "./cf-deploy-akto < <(echo 'test')"
              - 'TOKEN=`curl -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600"`'
              - 'PRIVATE_IP=$(curl -H "X-aws-ec2-metadata-token: $TOKEN" -v http://169.254.169.254/latest/meta-data/local-ipv4)'
              - sed -i "s/\${INSTANCE_IP}/$PRIVATE_IP/g" ~/akto/infra/docker-compose-mongo-cluster.yml
              - curl -fsSL 'https://raw.githubusercontent.com/akto-api-security/infra/feature/quick-setup/cf-deploy-akto-start' > cf-deploy-akto-start
              - sudo chmod 700 cf-deploy-akto-start
              - "./cf-deploy-akto-start < <(echo 'test')"
              - Fn::Join:
                - ''
                - - sudo /opt/aws/bin/cfn-signal -s true
                  - "         --stack "
                  - Ref: AWS::StackName
                  - "         --resource AktoMongoSecondary2Instance"
                  - "         --region "
                  - Ref: AWS::Region
