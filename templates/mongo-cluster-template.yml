Outputs:
  MongoConnURL:
    Value: !Sub mongodb://${AktoMongoPrimaryInstance.PrivateIp}:27017,${AktoMongoSecondary1Instance.PrivateIp}:27017,${AktoMongoSecondary2Instance.PrivateIp}:27017/admini
    Description: Mongo connection url