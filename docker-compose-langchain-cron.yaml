version: '2.1'

services:
  langchain-cron:
    image: public.ecr.aws/aktosecurity/agent-traffic-collector:langchain-shield-cron_latest
    env_file: ./langchain-cron.env
    restart: always
    entrypoint: ["/bin/sh", "-c"]
    command: ["./langchain-shield -schedule '0 */10 * * * *'"]

  watchtower:
    image: containrrr/watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    env_file: ./watchtower.env
    labels:
      com.centurylinklabs.watchtower.enable: "false"
