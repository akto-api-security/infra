
services:
  webhook-site-redis:
    image: redis:alpine
    container_name: webhook-site-redis
    restart: always
    command: ["redis-server", "--notify-keyspace-events", "KEA"]

  webhook-site-nginx:
    image: nginx:alpine
    container_name: webhook-site-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      # Minimal: only POST /token, GET /token/{uuid}/requests, and /{uuid} capture (no UI)
      - ./nginx/nginx-minimal.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - webhook-site

  webhook-site:
    image: webhooksite/webhook.site
    container_name: webhook-site
    hostname: webhook-site
    restart: always
    expose:
      - "80"
    env_file:
      - docker-compose.webhook.env
    depends_on:
      - webhook-site-redis

  laravel-echo-server:
    image: webhooksite/laravel-echo-server
    container_name: laravel-echo-server
    command:
      - exec
      - laravel-echo-server
      - start
      - --force
    env_file:
      - docker-compose.webhook.env
    depends_on:
      - webhook-site
      - webhook-site-redis

  akto-test-util-worker:
    image: public.ecr.aws/aktosecurity/akto-test-util-worker:latest
    container_name: akto-test-util-worker
    restart: always
    env_file:
      - docker-compose.webhook.env
    depends_on:
      - webhook-site-redis

  watchtower:
    image: containrrr/watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    env_file: ./watchtower.env
    labels:
      com.centurylinklabs.watchtower.enable: "false" 