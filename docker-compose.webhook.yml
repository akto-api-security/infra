
services:
  webhook-site-redis:
    image: redis:alpine
    container_name: webhook-site-redis
    restart: always
    command: ["redis-server", "--notify-keyspace-events", "KEA"]

  webhook-site-nginx:
    image: nginx:alpine
    container_name: webhook-site-nginx
    restart: always
    ports:
      - "5200:80"
    volumes:
      # Minimal: only POST /token, GET /token/{uuid}/requests, and /{uuid} capture (no UI)
      - ./nginx/nginx-minimal.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - webhook-site

  webhook-site:
    image: webhooksite/webhook.site
    container_name: webhook-site
    hostname: webhook-site
    restart: always
    expose:
      - "80"
    environment:
      APP_ENV: dev
      APP_DEBUG: "true"
      APP_URL: http://localhost:5200
      APP_LOG: errorlog
      DB_CONNECTION: sqlite
      REDIS_HOST: webhook-site-redis
      BROADCAST_DRIVER: redis
      CACHE_DRIVER: redis
      QUEUE_DRIVER: redis
      ECHO_HOST_MODE: path
    depends_on:
      - webhook-site-redis

  laravel-echo-server:
    image: webhooksite/laravel-echo-server
    container_name: laravel-echo-server
    command:
      - exec
      - laravel-echo-server
      - start
      - --force
    environment:
      LARAVEL_ECHO_SERVER_AUTH_HOST: http://webhook-site
      LARAVEL_ECHO_SERVER_HOST: 0.0.0.0
      LARAVEL_ECHO_SERVER_PORT: "6001"
      ECHO_REDIS_PORT: "6379"
      ECHO_REDIS_HOSTNAME: webhook-site-redis
      ECHO_PROTOCOL: http
      ECHO_ALLOW_CORS: "true"
      ECHO_ALLOW_ORIGIN: "*"
      ECHO_ALLOW_METHODS: "*"
      ECHO_ALLOW_HEADERS: "*"
    depends_on:
      - webhook-site
      - webhook-site-redis

  akto-test-util-worker:
    image: public.ecr.aws/aktosecurity/akto-test-util-worker:latest
    container_name: akto-test-util-worker
    restart: always
    env_file:
      - docker-compose.webhook.env
    depends_on:
      - webhook-site-redis
