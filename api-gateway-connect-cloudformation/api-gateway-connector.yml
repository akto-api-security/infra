AWSTemplateFormatVersion: 2010-09-09
Description: >-
  Deploy Akto AWS API Gateway connector on a single EC2 instance. This stack
  only deploys the connector and does not create Akto mini-runtime resources.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where the connector EC2 instance should run.

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet where the connector EC2 instance should run.

  KeyPair:
    Type: String
    Default: ''
    Description: Optional EC2 key pair name. Leave empty to use SSM only.

  InstanceType:
    Type: String
    Default: c5.large
    Description: EC2 instance type for connector host.

  AktoKafkaBrokerMal:
    Type: String
    Description: Kafka broker endpoint in format <AktoNLB-DNS>:9092.

  LogGroupName:
    Type: CommaDelimitedList
    Description: Comma-separated list of API Gateway CloudWatch log group names to read from.

  DatabaseAbstractorToken:
    Type: String
    NoEcho: true
    Description: Database abstractor token from Akto Dashboard.

Conditions:
  HasKeyPair: !Not [!Equals [!Ref KeyPair, '']]

Resources:
  ConnectorInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ApiGatewayCloudwatchReadPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:FilterLogEvents
                  - logs:GetLogEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*
              - Effect: Allow
                Action:
                  - apigateway:GET
                Resource:
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/restapis
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/restapis/*
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/*

  ConnectorInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: /
      Roles:
        - !Ref ConnectorInstanceRole

  ConnectorSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Akto API Gateway connector EC2
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  ConnectorInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref ConnectorInstanceProfile
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref ConnectorSecurityGroup
      KeyName: !If [HasKeyPair, !Ref KeyPair, !Ref AWS::NoValue]
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 2
      Tags:
        - Key: Name
          Value: akto-api-gateway-connector
      UserData:
        Fn::Base64:
          Fn::Sub:
            - |
              #!/bin/bash
              set -e
              yum update -y
              yum install -y docker
              systemctl enable docker
              systemctl start docker

              mkdir -p /usr/local/lib/docker/cli-plugins
              curl -SL https://github.com/docker/compose/releases/download/v2.24.0/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose
              chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

              mkdir -p /opt/akto-connector

              cat > /opt/akto-connector/connector.env <<ENVVARS
              AKTO_BYTES_IN_THRESHOLD=100
              AKTO_TRAFFIC_BATCH_TIME_SECS=10
              AKTO_TRAFFIC_BATCH_SIZE=100
              AKTO_KAFKA_BROKER_MAL=${AktoKafkaBrokerMal}
              CLOUDWATCH_READ_BATCH_SIZE=5
              LOG_GROUP_NAME=${LogGroupNameStr}
              AWS_REGION=${AWS::Region}
              DATABASE_ABSTRACTOR_TOKEN=${DatabaseAbstractorToken}
              DISCOVER_OPENAPI_SPEC=false
              OPENAPI_DISCOVERY_INTERVAL_MINUTES=15
              AKTO_LOG_LEVEL=DEBUG
              ENVVARS

              cat > /opt/akto-connector/docker-compose.yml <<COMPOSE
              version: "3.9"

              services:
                api-gateway-logging:
                  image: aktosecurity/mirror-api-logging:api-gateway-logging-openapi
                  pull_policy: always
                  container_name: api-gateway-logging
                  restart: unless-stopped
                  env_file:
                    - ./connector.env

                watchtower:
                  image: containrrr/watchtower
                  restart: always
                  volumes:
                    - /var/run/docker.sock:/var/run/docker.sock
                  env_file: ./watchtower.env
                  labels:
                    com.centurylinklabs.watchtower.enable: "false"
              COMPOSE

              cat > /opt/akto-connector/watchtower.env <<WATCHTOWER
              WATCHTOWER_CLEANUP=true
              WATCHTOWER_POLL_INTERVAL=1800
              WATCHTOWER

              cd /opt/akto-connector
              docker compose up -d
            - LogGroupNameStr: !Ref LogGroupName

Outputs:
  ConnectorInstanceId:
    Description: Connector EC2 instance ID
    Value: !Ref ConnectorInstance

  ConnectorPrivateIp:
    Description: Connector EC2 private IP
    Value: !GetAtt ConnectorInstance.PrivateIp

  ConnectorSecurityGroupId:
    Description: Security group ID attached to connector EC2
    Value: !Ref ConnectorSecurityGroup
