version: '2.1'

services:
  agent-guard:
    image: aktosecurity/akto-agent-guard-worker:local
    container_name: agent-guard
    ports:
      - "8080:8090"
    env_file:
      - ./docker-compose-agent-guard.env
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "2"
