version: '2.1'

services:
  n8n-cron:
    image: public.ecr.aws/aktosecurity/n8n-shield-cron:latest
    env_file: ./n8n-cron.env
    restart: always
    entrypoint: ["/bin/sh", "-c"]
    command: ["./n8n-cron -schedule '0 */10 * * * *'"]

  watchtower:
    image: containrrr/watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    env_file: ./watchtower.env
    labels:
      com.centurylinklabs.watchtower.enable: "false"
