version: '2.1'

services:
  traffic-jobs:
    image: aktosecurity/akto-api-security-dashboard:a-temp-activate-traffic-jobs
    env_file: ./docker-dashboard-jobs.env
    restart: always
    mem_limit: 5g
    ports:
      - "8081:8080"
    tmpfs:
      - /tmp:size=2g
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "3"

  important-crons:
    image: aktosecurity/akto-api-security-dashboard:a-temp-temp-run-important-crons
    env_file: ./docker-dashboard-jobs.env
    restart: always
    mem_limit: 5g
    ports:
      - "8080:8080"
    tmpfs:
      - /tmp:size=2g
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "3"

  job-crons:
    image: aktosecurity/akto-api-security-dashboard:a-temp-new-activate-traffic-jobs
    env_file: ./docker-dashboard-jobs-new.env
    restart: always
    mem_limit: 5g
    ports:
      - "8082:8080"
    tmpfs:
      - /tmp:size=2g
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "3"

  watchtower:
    image: containrrr/watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    env_file: ./watchtower.env
    mem_limit: 200m
    labels:
      com.centurylinklabs.watchtower.enable: "false"
