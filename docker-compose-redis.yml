# Dedicated Redis instance for the Agent Guard semantic cache.
#
# Deploy this on its OWN host/instance. The agent-guard stack
# (docker-compose-agent-guard.yml) reaches it over the network via REDIS_URL
# (set in docker-compose-agent-guard.env), e.g.
#   REDIS_URL=redis://:<password>@<this-host>:6379
#
# Must be redis-stack-server (not plain redis): the vector cache needs the
# RediSearch module (FT.* commands).
#
# Auth: REDIS_PASSWORD is REQUIRED — set it in the environment or a `.env` beside
# this file before `docker-compose -f docker-compose-redis.yml up -d`. On GCP the
# startup-script fetches it from Secret Manager and writes it to ~/akto/infra/.env.
# Also restrict access at the firewall/security-group to the agent-guard host(s).

services:
  redis:
    image: redis/redis-stack-server:7.4.0-v1
    container_name: agent-guard-redis
    restart: always
    ports:
      - "6379:6379"
    environment:
      # AOF persistence so the warmed cache survives restarts; REDIS_PASSWORD is
      # required (compose errors out if unset). Kept a single ${VAR} / ${VAR:?}
      # form so it works under docker-compose v1 used by the GCP cf-deploy flow.
      REDIS_ARGS: "--appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
    volumes:
      - agent-guard-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:?REDIS_PASSWORD must be set} ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  agent-guard-redis-data:
