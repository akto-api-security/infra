version: '2.1'

services:
  zoo1:
    image: public.ecr.aws/aktosecurity/confluentinc-cp-zookeeper:7.9.2-1-ubi8
    restart: always
    hostname: zoo1
    user: "0"  
    volumes:
      - ./data-zoo-data:/var/lib/zookeeper/data
      - ./data-zoo-logs:/var/lib/zookeeper/log
      - ./data-zoo-secrets:/etc/zookeeper/secrets              
    container_name: zoo1
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_SERVERS: zoo1:2888:3888

  kafka1:
    image: public.ecr.aws/aktosecurity/confluentinc-cp-kafka:7.9.2-1-ubi8
    restart: always
    hostname: kafka1
    user: "0"
    ports:
      - "9092:9092"
      - "19092:19092"
      - "29092:29092"
      - "9999:9999"
    environment:
      KAFKA_ADVERTISED_LISTENERS: LISTENER_DOCKER_EXTERNAL_DIFFHOST://${AKTO_KAFKA_IP}:9092, LISTENER_DOCKER_INTERNAL://kafka1:19092,LISTENER_DOCKER_EXTERNAL_LOCALHOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: LISTENER_DOCKER_EXTERNAL_DIFFHOST:PLAINTEXT, LISTENER_DOCKER_INTERNAL:PLAINTEXT,LISTENER_DOCKER_EXTERNAL_LOCALHOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: LISTENER_DOCKER_INTERNAL
      KAFKA_ZOOKEEPER_CONNECT: "zoo1:2181"
      KAFKA_BROKER_ID: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CREATE_TOPICS: "akto.trafficdata:3:3"
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 60000
      KAFKA_LOG_RETENTION_HOURS: 5
      KAFKA_LOG_SEGMENT_BYTES: 104857600
      KAFKA_LOG_CLEANER_ENABLE: "true"
      KAFKA_CLEANUP_POLICY: "delete"
      KAFKA_LOG_RETENTION_BYTES: 10737418240
    volumes:
      - ./data-kafka-data:/var/lib/kafka/data
      - ./data-kafka-secrets:/etc/kafka/secrets             
    depends_on:
      - zoo1
      
  akto-api-security-writes-producer:
    image: public.ecr.aws/aktosecurity/akto-api-security-database-abstractor:kafkalatest
    env_file: ./docker-writes-producer.env
    container_name: cyborg-producer
    environment:
      APP_NAME: "api-service"
    restart: always
    mem_limit: 20g
    ports:
      - "9001:8080"
    depends_on:
      - kafka1
      - fluentbit
    logging:
      driver: fluentd
      options:
        tag: docker.backend
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        fluentd-retry-wait: "1s"
        fluentd-max-retries: "3"

  akto-api-security-writes-consumer:
    image: public.ecr.aws/aktosecurity/akto-api-security-database-abstractor:kafkalatest
    env_file: ./docker-writes-consumer.env
    container_name: cyborg-consumer
    environment:
      APP_NAME: "consumer"
    restart: always
    mem_limit: 6g
    depends_on:
      - kafka1
    logging:
      driver: "json-file"
      options:
        max-size: "1g"
        max-file: "3"

  akto-api-security-writes-consumer-2:
    image: public.ecr.aws/aktosecurity/akto-api-security-database-abstractor:kafkalatest
    env_file: ./docker-writes-consumer.env
    environment:
      AKTO_KAFKA_ACCOUNT_ID: 1736798101
      APP_NAME: "consumer-account-specific"
    restart: always
    mem_limit: 6g
    depends_on:
      - kafka1
    logging:
      driver: "json-file"
      options:
        max-size: "1g"
        max-file: "3"

  akto-api-security-writes-consumer-traffic:
    image: public.ecr.aws/aktosecurity/akto-api-security-database-abstractor:kafkalatest
    env_file: ./docker-writes-consumer-traffic.env
    environment:
      APP_NAME: "consumer-traffic"
    restart: always
    mem_limit: 6g
    depends_on:
      - kafka1
    logging:
      driver: "json-file"
      options:
        max-size: "1g"
        max-file: "3"

  fluentbit:
    image: fluent/fluent-bit:latest
    container_name: fluentbit
    env_file: ./docker-fluentbit.env
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    restart: always
    mem_limit: 600m
    volumes:
      - ../config-files/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf
      - ../config-files/parsers.conf:/fluent-bit/etc/parsers.conf
      - ../config-files/extract_account.lua:/fluent-bit/etc/extract_account.lua

  watchtower:
    image: public.ecr.aws/aktosecurity/containrrr-watchtower:latest
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    env_file: ./watchtower.env
    mem_limit: 200m
    labels:
      com.centurylinklabs.watchtower.enable: "false"

