version: "2.1"

# Host + per-container metrics for the cyborg VM, scraped by the central Prometheus.
# Kept separate from the app compose. Both endpoints are UNAUTHENTICATED — keep them
# reachable only inside the VNet.
#   cd akto-monitoring && docker-compose up -d

services:
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: always
    network_mode: host                 # binds :9100 on the host
    pid: host
    mem_limit: 128m
    volumes:
      - "/:/host:ro,rslave"
    command:
      - "--path.rootfs=/host"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: always
    ports:
      # host port defaults to 8081; override per-VM where 8081 is taken (dashboard VM
      # uses 8082 because akto-internal already holds 8081). cadvisor listens on 8080 inside.
      - "${CADVISOR_HOST_PORT:-8081}:8080"
    mem_limit: 256m
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    # If cadvisor errors on cgroups access, uncomment:
    # privileged: true
