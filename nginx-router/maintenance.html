<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="30">
    <title>Temporarily unavailable</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f7f7f8;
            color: #202124;
        }

        main {
            max-width: 600px;
            margin: 24px;
            padding: 48px;
            text-align: center;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #5f6368;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <main>
        <h1>We'll be back shortly</h1>
        <p>
            The service is temporarily unavailable. We are working to restore
            it. This page will refresh automatically.
        </p>
    </main>
</body>
</html>
