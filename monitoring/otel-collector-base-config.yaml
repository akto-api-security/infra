# Shared base config, meant to be hosted at a stable URL and loaded via:
#   otelcol-contrib --config=https://<host>/otel-collector-base-config.yaml --config=file:/etc/otelcol-contrib/override.yaml
#
# Deliberately excludes anything environment-specific (endpoint, auth header)
# - those get merged in separately at runtime via the local override file
# (see otel-collector-override-config.yaml), so this file stays identical
# across every environment and can live somewhere without strict access
# control.

receivers:
  host_metrics:
    collection_interval: 15s
    scrapers:
      cpu:
      disk:
      filesystem:
      load:
      memory:
      network:
      paging:
      processes:

processors:
  batch:
  resource_detection:
    detectors: [env, azure, system]
    system:
      hostname_sources: [os]

exporters:
  # endpoint and any auth headers are supplied by the override file - see
  # otel-collector-override-config.yaml
  otlphttp:
    tls:
      insecure: false

service:
  pipelines:
    metrics:
      receivers: [host_metrics]
      processors: [resource_detection, batch]
      exporters: [otlphttp]
